test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

supabase:
  service: S3
  access_key_id: <%= ENV['SUPABASE_S3_ACCESS_KEY_ID'] %>
  secret_access_key: <%= ENV['SUPABASE_S3_SECRET_ACCESS_KEY'] %>
  region: <%= ENV.fetch('SUPABASE_S3_REGION', 'us-west-1') %>
  bucket: <%= ENV.fetch('SUPABASE_STORAGE_BUCKET', 'twitter-clone-images') %>
  endpoint: <%= ENV['SUPABASE_S3_ENDPOINT'] %>
  force_path_style: true

# Other Active Storage services can be added here if needed.
